name: Convert OpenAPI to Postman Collection

on:
  workflow_dispatch:
    inputs:
      openapi_path:
        description: Path to the OpenAPI file
        required: false
        default: openapi.yaml
        type: string
      output_path:
        description: Path for generated Postman collection JSON
        required: false
        default: postman-collection.json
        type: string
      publish_to_postman:
        description: Publish generated collection to Postman public collection
        required: false
        default: true
        type: boolean
      sync_public_schema:
        description: Sync OpenAPI to Postman public spec
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - liblab-postmain-migration
    paths:
      - "openapi.*"
      - "scripts/**"
      - ".github/workflows/convert-openapi-to-postman-collection.yaml"

jobs:
  convert:
    name: Convert OpenAPI to collection JSON
    runs-on: ubuntu-latest
    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      POSTMAN_PUBLIC_COLLECTION_UID: ${{ vars.POSTMAN_PUBLIC_COLLECTION_UID }}
      POSTMAN_PUBLIC_SPEC_ID: ${{ vars.POSTMAN_PUBLIC_SPEC_ID }}
      POSTMAN_PUBLIC_SPEC_FILE_PATH: ${{ vars.POSTMAN_PUBLIC_SPEC_FILE_PATH }}
      OPENAPI_PATH: ${{ github.event.inputs.openapi_path || 'openapi.yaml' }}
      OUTPUT_PATH: ${{ github.event.inputs.output_path || 'postman-collection.json' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Convert OpenAPI to Postman collection
        run: |
          set -euo pipefail
          output_dir="$(dirname "${OUTPUT_PATH}")"
          mkdir -p "$output_dir"
          npx --yes openapi-to-postmanv2 \
            -s "${OPENAPI_PATH}" \
            -o "${OUTPUT_PATH}" \
            -p

      - name: Post-process collection structure and names
        run: |
          set -euo pipefail
          python3 scripts/postprocess_postman_collection.py "${OUTPUT_PATH}"

      - name: Validate generated collection JSON
        run: |
          set -euo pipefail
          jq empty "${OUTPUT_PATH}"

      - name: Sync OpenAPI to public Postman spec
        if: ${{ github.event_name == 'push' || github.event.inputs.sync_public_schema == 'true' }}
        run: |
          set -euo pipefail
          if [[ -z "${POSTMAN_API_KEY}" || -z "${POSTMAN_PUBLIC_SPEC_ID}" ]]; then
            echo "Error: POSTMAN_API_KEY secret and POSTMAN_PUBLIC_SPEC_ID var are required to sync public spec"
            echo "::error::POSTMAN_API_KEY secret and POSTMAN_PUBLIC_SPEC_ID var are required to sync public spec"
            exit 1
          fi
          spec_file_path="${POSTMAN_PUBLIC_SPEC_FILE_PATH:-openapi.yaml}"
          spec_file_path_encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$spec_file_path")"
          jq -n --rawfile spec "${OPENAPI_PATH}" '{content:$spec}' > postman-public-spec-payload.json
          curl -fsS -X PATCH \
            "https://api.getpostman.com/specs/${POSTMAN_PUBLIC_SPEC_ID}/files/${spec_file_path_encoded}" \
            -H "X-Api-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @postman-public-spec-payload.json
          echo "Synced public Postman spec from ${OPENAPI_PATH}"

      - name: Publish collection to Postman
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_to_postman == 'true' }}
        run: |
          set -euo pipefail
          if [[ -z "${POSTMAN_API_KEY}" || -z "${POSTMAN_PUBLIC_COLLECTION_UID}" ]]; then
            echo "Error: POSTMAN_API_KEY secret and POSTMAN_PUBLIC_COLLECTION_UID var are required to publish"
            echo "::error::POSTMAN_API_KEY secret and POSTMAN_PUBLIC_COLLECTION_UID var are required to publish"
            exit 1
          fi
          jq -c '{collection: .}' "${OUTPUT_PATH}" > postman-collection-payload.json
          curl -fsS -X PUT \
            "https://api.getpostman.com/collections/${POSTMAN_PUBLIC_COLLECTION_UID}" \
            -H "X-Api-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @postman-collection-payload.json
          echo "Published generated collection to Postman collection UID ${POSTMAN_PUBLIC_COLLECTION_UID}"

      - name: Upload generated collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-collection
          path: ${{ env.OUTPUT_PATH }}
