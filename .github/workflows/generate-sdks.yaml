name: Generate SDKs using Postman

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - liblab-postmain-migration
    paths:
      - ".postman/config.json"
      - "openapi.*"
      - "hooks/**"
      - "customPlanModifiers/**"
      - ".github/workflows/generate-sdks.yaml"
jobs:
  build-and-pr:
    name: Generate SDKs and create PRs
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.run_number != 1 }}
    env:
      POSTMAN_CI: true
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      POSTMAN_CODEGEN_COLLECTION_UID: ${{ vars.POSTMAN_CODEGEN_COLLECTION_UID }}
      POSTMAN_CODEGEN_SPEC_ID: ${{ vars.POSTMAN_CODEGEN_SPEC_ID }}
      POSTMAN_CODEGEN_SPEC_FILE_PATH: ${{ vars.POSTMAN_CODEGEN_SPEC_FILE_PATH }}
    steps:
      - name: Check if secrets are set
        run: |
          if [[ -n "${{ secrets.POSTMAN_API_KEY }}" && -n "${{ vars.POSTMAN_CODEGEN_COLLECTION_UID }}" && -n "${{ vars.POSTMAN_CODEGEN_SPEC_ID }}" ]]; then
            echo "Secrets are set, proceeding with the workflow"
          else
            echo "Error: POSTMAN_API_KEY secret, POSTMAN_CODEGEN_COLLECTION_UID and POSTMAN_CODEGEN_SPEC_ID vars are required"
            echo "::error::POSTMAN_API_KEY secret, POSTMAN_CODEGEN_COLLECTION_UID and POSTMAN_CODEGEN_SPEC_ID vars are required"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install postman
        run: npm install -g postman-cli
      - name: Sync OpenAPI to Postman codegen spec
        run: |
          set -euo pipefail
          spec_file_path="${POSTMAN_CODEGEN_SPEC_FILE_PATH:-openapi.yaml}"
          spec_file_path_encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$spec_file_path")"
          jq -n --rawfile spec openapi.yaml '{content:$spec}' > postman-codegen-spec-payload.json
          curl -fsS -X PATCH \
          "https://api.getpostman.com/specs/${POSTMAN_CODEGEN_SPEC_ID}/files/${spec_file_path_encoded}" \
          -H "X-Api-Key: ${POSTMAN_API_KEY}" \
          -H "Content-Type: application/json" \
          --data @postman-codegen-spec-payload.json
          echo "Postman codegen spec synced from openapi.yaml"
      - name: Convert OpenAPI to codegen collection JSON
        run: |
          set -euo pipefail
          npx --yes openapi-to-postmanv2 \
            -s openapi.yaml \
            -o codegen-collection.json \
            -p
      - name: Sync codegen collection from OpenAPI
        run: |
          set -euo pipefail
          jq -c '{collection: .}' codegen-collection.json > postman-codegen-collection-payload.json
          curl -fsS -X PUT \
            "https://api.getpostman.com/collections/${POSTMAN_CODEGEN_COLLECTION_UID}" \
            -H "X-Api-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @postman-codegen-collection-payload.json
          echo "Postman codegen collection synced from openapi.yaml"
      - name: Start Build
        run: postman sdk generate "$POSTMAN_CODEGEN_COLLECTION_UID" --config .postman/config.json --all --yes --pr
